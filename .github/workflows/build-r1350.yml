name: Build OpenWrt for Xiaomi R1350 (Mi Router 4 Pro) + OpenClash IPK

# 手动触发：进入 Actions 页面，选择本工作流，点 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write   # 允许创建 Release 并上传固件

jobs:
  build:
    name: Build lean R1350 firmware + standalone OpenClash IPK
    runs-on: ubuntu-22.04      # OpenWrt 24.10 在 22.04 上验证过（python3-distutils 仍可用）
    timeout-minutes: 300

    env:
      OPENWRT_BRANCH: openwrt-24.10
      OPENWRT_COMMIT: 924f06e76cd73e24d39691a4de621bdcae80a756
      PORT_REPO: https://github.com/nyarime/openwrt-r1350.git
      OPENCLASH_REPO: https://github.com/vernesong/OpenClash.git
      OPENCLASH_BRANCH: master
      TARGET_NAME: openwrt-ath79-generic-xiaomi_mi-router-4-pro-r1350
      FW_PART_MAX: 14680064     # firmware 分区 14 MiB = 14*1024*1024，超出会编译失败

    steps:
      - name: Free disk space
        run: |
          echo "===== disk before ====="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "===== disk after ====="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      # 拉取 R1350 移植补丁与 config.seed（无需手动上传任何文件）
      - name: Checkout R1350 port (patches + config.seed)
        uses: actions/checkout@v4
        with:
          repository: nyarime/openwrt-r1350
          ref: main
          path: r1350-port

      # 缓存下载目录，重跑时省去重复下载
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-r1350-dl-${{ env.OPENWRT_COMMIT }}
          restore-keys: |
            openwrt-r1350-dl-

      - name: Clone OpenWrt 24.10 (pinned commit)
        run: |
          git clone --filter=blob:none --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "$OPENWRT_COMMIT"
          git rev-parse HEAD

      # 把 OpenClash 注册为第三方 feed（这样才能单独编译它的 ipk）
      - name: Add OpenClash feed
        working-directory: openwrt
        run: |
          echo "src-git openclash ${OPENCLASH_REPO};${OPENCLASH_BRANCH}" >> feeds.conf.default
          tail -n 5 feeds.conf.default

      - name: Apply R1350 patches
        working-directory: openwrt
        run: |
          # 注意：上游 0001-r1350-add-dts.patch 格式有误（新建文件却写成 "--- a/..." 而非
          # "--- /dev/null"），git apply 会报 "bad git-diff - expected /dev/null"。
          # 因此直接复制仓库里现成的完整 DTS 文件，内容完全一致且更可靠。
          cp ../r1350-port/dts/qca9563_xiaomi_mi-router-4-pro-r1350.dts \
             target/linux/ath79/dts/qca9563_xiaomi_mi-router-4-pro-r1350.dts
          git apply ../r1350-port/patches/0002-r1350-image-leds-network.patch
          cp ../r1350-port/files/etc/uci-defaults/99-r1350-flow-offload \
             target/linux/ath79/generic/base-files/etc/uci-defaults/
          echo "DTS copied + patch 0002 applied"

      # 关键策略：固件保持精简（约 7-8 MB，稳进 14MB 分区），
      # OpenClash 及 ruby 大依赖用 =m 只编译成 ipk、不进固件，刷机后再安装。
      - name: Feeds and prepare .config (lean firmware + OpenClash as IPK)
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp ../r1350-port/patches/config.seed .config

          # ---- 固件部分：仅加入 OpenClash 运行所需的小依赖 ----
          # 1) dnsmasq -> dnsmasq-full（OpenClash 依赖；体积增加很小）
          sed -i 's/^CONFIG_PACKAGE_dnsmasq=y$/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          sed -i '/^# CONFIG_PACKAGE_dnsmasq-full is not set$/c\CONFIG_PACKAGE_dnsmasq-full=y' .config
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y' .config || echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config
          # 2) firewall4 透明代理所需的小模块（进固件，避免装 ipk 时再拉 kmod）
          sed -i '/^# CONFIG_PACKAGE_kmod-nft-tproxy is not set$/d' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-tproxy=y' .config || echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          sed -i '/^# CONFIG_PACKAGE_kmod-inet-diag is not set$/d' .config
          grep -q '^CONFIG_PACKAGE_kmod-inet-diag=y' .config || echo 'CONFIG_PACKAGE_kmod-inet-diag=y' >> .config
          grep -q '^CONFIG_PACKAGE_luci-compat=y' .config || echo 'CONFIG_PACKAGE_luci-compat=y' >> .config

          # ---- OpenClash 部分：=m 表示只生成 ipk、不打包进固件 ----
          # ruby / ruby-yaml / bash / curl 等依赖会由 Kconfig 自动变成 =m
          echo 'CONFIG_PACKAGE_luci-app-openclash=m' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=m' >> .config

          make defconfig
          echo "===== key config check ====="
          grep -E '^CONFIG_TARGET_(ARCH|SUBTARGET|BOARD)=' .config
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|dnsmasq-full|kmod-nft-tproxy)=' .config || true
          grep -E '^CONFIG_TARGET_ath79_generic_DEVICE_.*=y' .config
          echo "===== module packages (built as ipk, NOT in firmware) ====="
          grep -E '^CONFIG_PACKAGE_.*=m$' .config | head -50

      - name: Download source packages
        working-directory: openwrt
        run: |
          make -j"$(nproc)" download || make -j1 download V=s

      # 一次编译同时产出：精简 sysupgrade 固件 + OpenClash 及其依赖 ipk
      - name: Build firmware and OpenClash ipk
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      # 空间守卫：squashfs 镜像必须能塞进 14 MiB 的 firmware 分区
      - name: Check firmware size
        working-directory: openwrt
        run: |
          IMG=$(find bin/targets/ath79/generic -name "${TARGET_NAME}-squashfs-sysupgrade.bin" | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::sysupgrade image not found - build likely failed or image too big"
            exit 1
          fi
          ACTUAL=$(stat -c%s "$IMG")
          echo "firmware size: $ACTUAL bytes; partition max: $FW_PART_MAX bytes"
          if [ "$ACTUAL" -gt "$FW_PART_MAX" ]; then
            echo "::error::Firmware ($ACTUAL B) exceeds 14 MiB firmware partition."
            exit 1
          fi
          echo "OK: firmware fits in partition ($(( FW_PART_MAX - ACTUAL )) bytes headroom)."

      - name: Collect firmware and OpenClash ipk bundle
        run: |
          mkdir -p artifacts ipk-bundle
          # 1) 固件（sysupgrade / initramfs / factory 等）
          cp -v openwrt/bin/targets/ath79/generic/${TARGET_NAME}-* artifacts/ 2>/dev/null || true

          # 2) OpenClash 及其依赖 ipk（=m 编译出来的）
          find openwrt/bin/packages -type f \( \
              -name 'luci-app-openclash*.ipk' -o \
              -name 'luci-i18n-openclash*.ipk' -o \
              -name 'ruby*.ipk' -o -name 'libruby*.ipk' -o \
              -name 'bash*.ipk' -o -name 'libreadline*.ipk' -o \
              -name 'curl*.ipk' -o -name 'libcurl*.ipk' -o \
              -name 'ip-full*.ipk' -o -name 'unzip*.ipk' -o \
              -name 'libbsd*.ipk' -o -name 'ca-bundle*.ipk' -o \
              -name 'kmod-tun*.ipk' \
            \) -exec cp -v {} ipk-bundle/ \; 2>/dev/null || true

          # 3) 一键安装脚本（刷机后在路由器上执行）
          cat > ipk-bundle/install.sh <<'EOF'
          #!/bin/sh
          # 用法：把本目录传到路由器的 /tmp/openclash-ipk，然后执行 sh install.sh
          cd "$(dirname "$0")" || exit 1
          echo "==> opkg update"
          opkg update
          echo "==> installing OpenClash and dependencies"
          opkg install ./*.ipk
          echo "==> done. Reboot, then LuCI -> Services -> OpenClash"
          EOF
          chmod +x ipk-bundle/install.sh
          tar czf artifacts/openclash-ipk-bundle.tar.gz -C ipk-bundle .

          echo "===== artifacts ====="
          ls -lh artifacts/
          echo "===== ipk bundle contents ====="
          ls -lh ipk-bundle/
          test -f "artifacts/${TARGET_NAME}-squashfs-sysupgrade.bin" || { echo "No sysupgrade firmware produced!"; exit 1; }
          test -s artifacts/openclash-ipk-bundle.tar.gz || { echo "No OpenClash ipk bundle produced!"; exit 1; }

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r1350-firmware-plus-openclash-ipk
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}   # gh 不依赖当前目录 .git（本 job 未 checkout 自身仓库）
          TAG: r1350-openclash-${{ github.run_number }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            NOTES="Auto-built from nyarime/openwrt-r1350 + vernesong/OpenClash. "
            NOTES="$NOTES FIRMWARE: flash *-squashfs-sysupgrade.bin (~7-8 MB, fits 14 MB partition). "
            NOTES="$NOTES OPENCLASH: NOT inside firmware (ruby deps too big for 16 MB flash). "
            NOTES="$NOTES Flash firmware first, then extract openclash-ipk-bundle.tar.gz on the router and run install.sh. "
            NOTES="$NOTES READ the flashing guide before use. Flash at your own risk."
            gh release create "$TAG" artifacts/* \
              --title "OpenWrt 24.10 for Xiaomi R1350 - lean firmware + standalone OpenClash IPK (build ${GITHUB_RUN_NUMBER})" \
              --notes "$NOTES"
          fi
