name: Build OpenWrt for Xiaomi R1350 (Mi Router 4 Pro) + OpenClash

# 手动触发：进入 Actions 页面，选择本工作流，点 "Run workflow"
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write   # 允许创建 Release 并上传固件

jobs:
  build:
    name: Build R1350 firmware with OpenClash
    runs-on: ubuntu-22.04      # OpenWrt 24.10 在 22.04 上验证过（python3-distutils 仍可用）
    timeout-minutes: 300

    env:
      OPENWRT_BRANCH: openwrt-24.10
      OPENWRT_COMMIT: 924f06e76cd73e24d39691a4de621bdcae80a756
      PORT_REPO: https://github.com/nyarime/openwrt-r1350.git
      OPENCLASH_REPO: https://github.com/vernesong/OpenClash.git
      OPENCLASH_BRANCH: master
      TARGET_NAME: openwrt-ath79-generic-xiaomi_mi-router-4-pro-r1350
      FW_PART_MAX: 14680064     # firmware 分区 14 MiB = 14*1024*1024，超出会编译失败

    steps:
      - name: Free disk space
        run: |
          echo "===== disk before ====="
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          echo "===== disk after ====="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-distutils \
            rsync unzip zlib1g-dev file wget

      # 拉取 R1350 移植补丁与 config.seed（无需手动上传任何文件）
      - name: Checkout R1350 port (patches + config.seed)
        uses: actions/checkout@v4
        with:
          repository: nyarime/openwrt-r1350
          ref: main
          path: r1350-port

      # 缓存下载目录，重跑时省去重复下载（key 绑定固定 commit + OpenClash 分支 tag）
      - name: Cache OpenWrt downloads
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: openwrt-r1350-dl-${{ env.OPENWRT_COMMIT }}
          restore-keys: |
            openwrt-r1350-dl-

      - name: Clone OpenWrt 24.10 (pinned commit)
        run: |
          git clone --filter=blob:none --branch "$OPENWRT_BRANCH" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "$OPENWRT_COMMIT"
          git rev-parse HEAD

      # 把 OpenClash 注册为第三方 feed（标准做法：追加到 feeds.conf.default）
      - name: Add OpenClash feed
        working-directory: openwrt
        run: |
          echo "src-git openclash ${OPENCLASH_REPO};${OPENCLASH_BRANCH}" >> feeds.conf.default
          tail -n 5 feeds.conf.default

      - name: Apply R1350 patches
        working-directory: openwrt
        run: |
          # 注意：上游 0001-r1350-add-dts.patch 格式有误（新建文件却写成 "--- a/..." 而非
          # "--- /dev/null"），git apply 会报 "bad git-diff - expected /dev/null"。
          # 因此直接复制仓库里现成的完整 DTS 文件，内容完全一致且更可靠。
          cp ../r1350-port/dts/qca9563_xiaomi_mi-router-4-pro-r1350.dts \
             target/linux/ath79/dts/qca9563_xiaomi_mi-router-4-pro-r1350.dts
          git apply ../r1350-port/patches/0002-r1350-image-leds-network.patch
          cp ../r1350-port/files/etc/uci-defaults/99-r1350-flow-offload \
             target/linux/ath79/generic/base-files/etc/uci-defaults/
          echo "DTS copied + patch 0002 applied"

      - name: Feeds and prepare .config with OpenClash
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 基于原作者的 config.seed，做最小改动以加入 OpenClash
          cp ../r1350-port/patches/config.seed .config
          # 1) dnsmasq -> dnsmasq-full（OpenClash 硬依赖；原 seed 里是 dnsmasq=y）
          sed -i 's/^CONFIG_PACKAGE_dnsmasq=y$/# CONFIG_PACKAGE_dnsmasq is not set/' .config
          sed -i '/^# CONFIG_PACKAGE_dnsmasq-full is not set$/c\CONFIG_PACKAGE_dnsmasq-full=y' .config
          grep -q '^CONFIG_PACKAGE_dnsmasq-full=y' .config || echo 'CONFIG_PACKAGE_dnsmasq-full=y' >> .config
          # 2) 打开 OpenClash 及其依赖（Kconfig 会自动选中 nft-tproxy/ruby-yaml 等）
          echo 'CONFIG_PACKAGE_luci-app-openclash=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-openclash-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-inet-diag=y' >> .config
          echo 'CONFIG_PACKAGE_luci-compat=y' >> .config
          # firewall4 环境需要 nftables 透明代理模块；先清掉 seed 里的 "not set" 再打开
          sed -i '/^# CONFIG_PACKAGE_kmod-nft-tproxy is not set$/d' .config
          echo 'CONFIG_PACKAGE_kmod-nft-tproxy=y' >> .config
          make defconfig
          echo "===== key config check ====="
          grep -E '^CONFIG_TARGET_(ARCH|SUBTARGET|BOARD)=' .config
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|dnsmasq-full|kmod-nft-tproxy)=' .config
          grep -E '^CONFIG_TARGET_ath79_generic_DEVICE_.*=y' .config

      - name: Download source packages
        working-directory: openwrt
        run: |
          make -j"$(nproc)" download || make -j1 download V=s

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" || make -j1 V=s

      # 空间守卫：squashfs 镜像必须能塞进 14 MiB 的 firmware 分区
      - name: Check firmware size
        working-directory: openwrt
        run: |
          IMG=$(find bin/targets/ath79/generic -name "${TARGET_NAME}-squashfs-sysupgrade.bin" | head -n1)
          if [ -z "$IMG" ]; then
            echo "::error::sysupgrade image not found - build likely failed or image too big"
            exit 1
          fi
          ACTUAL=$(stat -c%s "$IMG")
          echo "firmware size: $ACTUAL bytes; partition max: $FW_PART_MAX bytes"
          if [ "$ACTUAL" -gt "$FW_PART_MAX" ]; then
            echo "::error::Firmware ($ACTUAL B) exceeds 14 MiB firmware partition. OpenClash + ruby deps too big. Remove some packages or flash an extroot setup."
            exit 1
          fi
          echo "OK: firmware fits in partition."

      - name: Collect firmware
        run: |
          mkdir -p artifacts
          cp -v openwrt/bin/targets/ath79/generic/${TARGET_NAME}-* artifacts/ 2>/dev/null || true
          # 单独编译出的 OpenClash ipk 也一并收集，方便后续 extroot/opkg 安装
          find openwrt/bin/packages -name 'luci-app-openclash_*.ipk' -exec cp -v {} artifacts/ \; 2>/dev/null || true
          echo "===== artifacts ====="
          ls -lh artifacts/
          test -n "$(ls -A artifacts/)" || { echo "No firmware produced!"; exit 1; }

      - name: Upload firmware as artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-r1350-openclash-firmware
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: r1350-openclash-${{ github.run_number }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cd ..
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* \
              --title "OpenWrt 24.10 for Xiaomi R1350 + OpenClash (build ${GITHUB_RUN_NUMBER})" \
              --notes "Auto-built from nyarime/openwrt-r1350 + vernesong/OpenClash. Includes luci-app-openclash. SHA256SUMS included. READ the flashing guide before use. Flash at your own risk."
          fi
